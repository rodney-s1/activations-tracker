name: Build & Deploy to AWS S3

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter web
        run: |
          flutter build web --release \
            --base-href "/tools/billing-master/" \
            --dart-define=flutter.inspector.structuredErrors=false \
            --dart-define=debugShowCheckedModeBanner=false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to S3
        run: |
          aws s3 sync build/web/ s3://bluearrow-internal-portal/tools/billing-master/ \
            --delete \
            --exclude "*.map" \
            --exclude "*.zip"

      - name: Deploy Lambda (sync API)
        run: |
          cd aws/lambda
          zip -j function.zip index.mjs
          aws lambda update-function-code \
            --function-name billing-master-sync \
            --zip-file fileb://function.zip \
            --region us-east-1

      - name: Invalidate CloudFront cache
        run: |
          CREDS=$(aws sts assume-role \
            --role-arn arn:aws:iam::720808597626:role/BluearrowCFInvalidationRole \
            --role-session-name github-actions-billing-master \
            --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
            --output text)
          export AWS_ACCESS_KEY_ID=$(echo $CREDS | awk '{print $1}')
          export AWS_SECRET_ACCESS_KEY=$(echo $CREDS | awk '{print $2}')
          export AWS_SESSION_TOKEN=$(echo $CREDS | awk '{print $3}')
          aws cloudfront create-invalidation \
            --distribution-id E21I4ERHNZHIL6 \
            --paths "/tools/billing-master/*"

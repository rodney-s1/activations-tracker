AWSTemplateFormatVersion: '2010-09-09'
Description: >
  BillingMaster Sync API — IAM Role + DynamoDB + Lambda + HTTP API Gateway.
  Replaces Firebase Realtime Database as the shared settings backend
  for all bluearrowmail.com users of the Billing Tracker app.
  Self-contained: creates all resources including the Lambda execution role.

Resources:

  # ── IAM role for Lambda ────────────────────────────────────────────────────
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: BillingMasterLambdaRole
      Description: Allows billing-master-sync Lambda to write CloudWatch logs and access DynamoDB
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBSyncAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource: !GetAtt SyncTable.Arn

  # ── DynamoDB table ─────────────────────────────────────────────────────────
  # One item per sync node (9 items max). PK = nodeId (e.g. "rate_plan_overrides")
  SyncTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: BillingMasterSync
      BillingMode: PAY_PER_REQUEST
      TableClass: STANDARD
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: nodeId
          AttributeType: S
      KeySchema:
        - AttributeName: nodeId
          KeyType: HASH
      Tags:
        - Key: Project
          Value: billing-master

  # ── Lambda function ────────────────────────────────────────────────────────
  SyncFunction:
    Type: AWS::Lambda::Function
    DependsOn: LambdaExecutionRole
    Properties:
      FunctionName: billing-master-sync
      Description: GET/PUT handler for BillingMaster shared settings sync
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 15
      MemorySize: 128
      Architectures: [arm64]
      Environment:
        Variables:
          TABLE_NAME: !Ref SyncTable
      Code:
        ZipFile: |
          // Placeholder — replaced on first GitHub Actions deploy
          export const handler = async () => ({
            statusCode: 200,
            body: JSON.stringify({ status: 'placeholder' }),
          });
      Tags:
        - Key: Project
          Value: billing-master

  # ── HTTP API Gateway ───────────────────────────────────────────────────────
  SyncApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: billing-master-sync-api
      ProtocolType: HTTP
      Description: BillingMaster shared settings sync endpoint
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowMethods: [GET, PUT, OPTIONS]
        AllowHeaders: [Content-Type]
        MaxAge: 86400

  SyncIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref SyncApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub
        - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
        - FunctionArn: !GetAtt SyncFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 15000

  RouteGet:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref SyncApi
      RouteKey: 'GET /sync/{node}'
      Target: !Sub 'integrations/${SyncIntegration}'

  RoutePut:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref SyncApi
      RouteKey: 'PUT /sync/{node}'
      Target: !Sub 'integrations/${SyncIntegration}'

  RouteOptions:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref SyncApi
      RouteKey: 'OPTIONS /sync/{node}'
      Target: !Sub 'integrations/${SyncIntegration}'

  SyncApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref SyncApi
      StageName: '$default'
      AutoDeploy: true

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SyncFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${SyncApi}/*/*/sync/*'

Outputs:
  ApiEndpoint:
    Description: Paste this URL into cloud_sync_service.dart as _kApiEndpoint
    Value: !Sub 'https://${SyncApi}.execute-api.${AWS::Region}.amazonaws.com'

  TableName:
    Description: DynamoDB table name
    Value: !Ref SyncTable

  FunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt SyncFunction.Arn
